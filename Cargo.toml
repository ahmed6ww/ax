[package]
name = "axur"
version = "0.2.0"
edition = "2021"
authors = ["ahmed6ww"]
description = "Keep your team running the same agent setup on Claude Code and Codex"
license = "MIT"
readme = "README.md"
repository = "https://github.com/agenzalabs/ax"
keywords = ["ai", "agents", "cli", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "docs/",
    "npm/",
    "scripts/",
    ".github/",
    ".agent/",
    "install.sh",
    "install.ps1",
]

[[bin]]
name = "axur"
path = "src/main.rs"

[lib]
name = "axur_lib"
path = "src/lib.rs"

[dependencies]
# CLI Framework
clap = { version = "4.4", features = ["derive", "color", "suggestions"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# HTTP Client
# 0.12 for hyper 1.x: 0.11 pinned hyper 0.14, dragging in h2 0.3 and
# rustls 0.21, which carry four open RUSTSEC advisories between them.
# The "blocking" feature was enabled and never used.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# Path Utilities
dirs = "5.0"

# Terminal UI
cliclack = "0.5"
comfy-table = "8.0"
indicatif = "0.18"
console = "0.16"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
which = "6.0"
rpassword = "7.3"
sha2 = "0.10"
futures = "0.3"
serde-saphyr = "1"

# OS keychain (Windows Credential Manager / macOS Keychain / Linux Secret
# Service) for `axur secrets`. Default "v1" feature covers all three natively.
keyring = "4.1"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = true
strip = true
