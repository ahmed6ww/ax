# cargo-deny configuration, enforced by CI.
#
# The point is not ceremony: axur downloads and installs content that other
# people execute, so an unmaintained or ambiguously licensed dependency in that
# path is a real liability.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences only. axur ships as a single binary that people are
# expected to redistribute freely.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing here should pull in a second async runtime or TLS stack.
deny = [
    { name = "openssl-sys", reason = "rustls is used instead; no system OpenSSL dependency" },
    { name = "serde_yaml", reason = "unmaintained and deprecated; serde-saphyr replaced it" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
