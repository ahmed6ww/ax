name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required to attest that these binaries were built by this workflow from
  # this commit. Without it a release is a set of anonymous files.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag must not ship code that has never been verified. Previous releases
  # ran no tests at all.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: agentpm-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: agentpm-linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: agentpm-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: agentpm-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: agentpm-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Pinned. This previously installed from the tip of cross's default
      # branch, making every release depend on whatever landed there that day.
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/agentpm.exe" "${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/agentpm" "${{ matrix.artifact }}"
            chmod +x "${{ matrix.artifact }}"
          fi

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi
          cat "${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One file the installers can fetch and verify against, rather than five
      # separate sidecars.
      - name: Collect SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          rm -f ./*.sha256
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/agentpm-*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/agentpm-*
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
